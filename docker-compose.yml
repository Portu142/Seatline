# Local development stack: `docker compose up --build -d`
# Containers restart on their own whenever Docker starts (e.g. when you open Ubuntu/WSL again).
#   API + Swagger  -> http://localhost:8080/swagger
#   Web            -> http://localhost:4173
#   Mailpit (SMTP) -> http://localhost:8025   (used from block 4, ticket emails)
name: seatline

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatline}
      POSTGRES_USER: ${POSTGRES_USER:-seatline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatline}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-seatline};Username=${POSTGRES_USER:-seatline};Password=${POSTGRES_PASSWORD:-seatline}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-in-production-0123456789}
      Seed__DemoUsers: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-Seatline2026!}
      Cors__AllowedOrigins__0: http://localhost:4173
      Cors__AllowedOrigins__1: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
