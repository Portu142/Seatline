version: 2
updates:
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'Npgsql.*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: monthly
